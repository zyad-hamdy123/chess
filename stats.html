<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>إحصائيات التنزيل</title>
<style>body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:#0b0d0c;color:#f2f5f1;padding:24px;line-height:1.8}h1{font-size:1.6rem}.c{background:#1a1d1a;border:1px solid #2c322c;border-radius:16px;padding:16px 20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.n{font-size:1.8rem;font-weight:800;color:#7ddc5c}.m{color:#9aa59a;font-size:.85rem}</style></head><body>
<h1>عدد التنزيلات</h1><div id="o">جاري التحميل...</div><div class="c"><span>الإجمالي</span><span class="n" id="t">0</span></div>
<p class="m">الأرقام من GitHub Releases. بتتحدث لوحدها، وتنزيلات الروابط القديمة (من خارج Releases) مش متحسبة.</p>
<script>fetch("https://api.github.com/repos/zyad-hamdy123/chess/releases").then(function(r){return r.json()}).then(function(rs){var h="",t=0;rs.forEach(function(r){r.assets.forEach(function(a){if(!/\.apk$/.test(a.name))return;t+=a.download_count;h+='<div class="c"><div>'+a.name+'<div class="m">'+r.tag_name+'</div></div><span class="n">'+a.download_count+'</span></div>'})});document.getElementById("o").innerHTML=h||"مفيش تنزيلات لسه.";document.getElementById("t").textContent=t}).catch(function(){document.getElementById("o").textContent="مش قادر يجيب الأرقام دلوقتي، جرب بعدين."})</script></body></html>
